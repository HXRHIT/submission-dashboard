name: keepalive-streamlit

on:
  schedule:
    # Run twice a day at 10:00 and 22:00 KST (01:00 and 13:00 UTC)
    - cron: "0 1,13 * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App
        run: |
          URL="https://submission-dashboard-knfhzwjfmwecrdciurbfpe.streamlit.app/"
          echo "Pinging $URL to keep Streamlit Cloud awake..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -m 30 "$URL")
          echo "Received HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "Streamlit app is active and responsive."
          else
            echo "Warning: HTTP status was $HTTP_STATUS (or app may be waking up), retrying once..."
            sleep 5
            curl -s -o /dev/null -w "%{http_code}" -m 30 "$URL" || true
          fi
